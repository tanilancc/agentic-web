<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <meta name="robots" content="noindex">
  <title>Page not found</title>
  <!--
    One copy of this page is shared by every site in apps/sites.json. The deploy tool serves
    it with a 404 status for any address the site does not have. Links start with "/" so
    they work from any depth.
  -->
  <style>
    :root { --bg: #f5f7f7; --fg: #172426; --muted: #566a6d; --accent: #0f6b74; color-scheme: light dark; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0f191b; --fg: #e3ecec; --muted: #9db0b2; --accent: #5cc3cc; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 34rem; padding: 32px max(16px, env(safe-area-inset-left, 0px)); }
    .code { font: 600 .85rem ui-monospace, Menlo, monospace; letter-spacing: .1em; color: var(--muted); margin: 0; }
    h1 { font-size: 1.8rem; line-height: 1.2; margin: 6px 0 12px; }
    p { margin: 0 0 16px; }
    a { color: var(--accent); }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  </style>
</head>
<body>
<main>
  <p class="code">404</p>
  <h1>Page not found</h1>
  <p>There is no page at this address. It may have moved, or the link may have a typo.</p>
  <p><a href="/">Go to the home page</a> · <a href="/shared/privacy.html">Privacy and terms</a></p>
</main>
</body>
</html>
